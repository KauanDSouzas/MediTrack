<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>MediTrack - Login</title>

<style>
    body {
        margin: 0;
        font-family: "Segoe UI", Arial, sans-serif;
        background: #f2f6fc;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
    }

    .card {
        width: 380px;
        background: #ffffff;
        padding: 35px;
        border-radius: 18px;
        box-shadow: 0 8px 25px rgba(0,0,0,0.08);
        animation: fadeIn 0.3s ease;
    }

    h2 {
        text-align: center;
        color: #012b61;
        margin-bottom: 5px;
        font-size: 26px;
    }

    .subtitle {
        text-align: center;
        font-size: 14px;
        margin-bottom: 25px;
        color: #6c7a91;
    }

    input {
        width: 100%;
        padding: 12px;
        border-radius: 10px;
        border: 1px solid #ccd6e0;
        margin-bottom: 15px;
        font-size: 14px;
    }

    input:focus {
        outline: none;
        border-color: #0d6efd;
        box-shadow: 0 0 4px rgba(13,110,253,0.3);
    }

    label {
        font-weight: bold;
        font-size: 13px;
        color: #23395d;
    }

    .btn {
        width: 100%;
        padding: 13px;
        border: none;
        border-radius: 10px;
        background: #0d6efd;
        color: white;
        font-size: 15px;
        cursor: pointer;
        margin-top: 5px;
    }

    .btn:hover {
        background: #0b5ed7;
    }

    .toggle {
        text-align: center;
        margin-top: 15px;
        font-size: 14px;
    }

    .toggle a {
        color: #0d6efd;
        text-decoration: none;
        font-weight: bold;
    }

    .hidden {
        display: none;
    }

    .logo {
        display: block;
        text-align: center;
        margin-bottom: 10px;
        font-size: 40px;
        color: #0d6efd;
    }

    @keyframes fadeIn {
        from {opacity: 0; transform: translateY(10px);}
        to {opacity: 1; transform: translateY(0);}
    }
</style>
</head>

<body>

<!-- LOGIN -->
<div class="card" id="login_area">
    <div class="logo">💙</div>
    <h2>MediTrack</h2>
    <div class="subtitle">Acesso ao Sistema de Gestão Hospitalar</div>

    <label>E-mail</label>
    <input id="login_email" type="email" placeholder="email@exemplo.com">

    <label>Senha</label>
    <input id="login_pass" type="password" placeholder="********">

    <button class="btn" onclick="login()">Entrar</button>

    <div class="toggle">
        Não tem conta? <a href="#" onclick="showRegister()">Cadastre-se</a>
    </div>
</div>

<!-- CADASTRO -->
<div class="card hidden" id="register_area">
    <div class="logo">💙</div>
    <h2>MediTrack</h2>
    <div class="subtitle">Crie sua conta de Paciente</div>

    <label>Nome completo</label>
    <input id="reg_name" type="text" placeholder="Seu nome completo">

    <label>Data de nascimento</label>
    <input id="reg_birth" type="date">

    <label>Contato (telefone ou celular)</label>
    <input id="reg_phone" type="text" placeholder="(xx) xxxxx-xxxx">

    <label>E-mail</label>
    <input id="reg_email" type="email" placeholder="nome@exemplo.com">

    <label>Senha</label>
    <input id="reg_pass" type="password" placeholder="********">

    <button class="btn" onclick="registerPatient()">Cadastrar</button>

    <div class="toggle">
        Já tem conta? <a href="#" onclick="showLogin()">Entrar</a>
    </div>
</div>

<script>
/* ======================================================
   USUÁRIOS PADRÃO
====================================================== */
function seedDefaults(){
    const defaults = [
        {name:"Paciente Exemplo", email:"paciente@meditrack.com", pass:"1234", role:"Paciente"},
        {name:"Profissional Exemplo", email:"profissional@meditrack.com", pass:"1234", role:"Profissional"},
        {name:"Administrador", email:"admin@meditrack.com", pass:"1234", role:"Administrador"}
    ];

    defaults.forEach(u=>{
        if(!localStorage.getItem("MEDI_USER_"+u.email)){
            localStorage.setItem("MEDI_USER_"+u.email, JSON.stringify(u));
        }
    });
}
seedDefaults();

/* ======================================================
   LOGIN
====================================================== */
function login(){
    const email = document.getElementById("login_email").value.trim();
    const pass  = document.getElementById("login_pass").value.trim();

    if(!email || !pass){
        alert("Preencha email e senha.");
        return;
    }

    const data = localStorage.getItem("MEDI_USER_" + email);
    if(!data){
        alert("Usuário não encontrado.");
        return;
    }

    const user = JSON.parse(data);

    if(user.pass !== pass){
        alert("Senha incorreta.");
        return;
    }

    localStorage.setItem("MEDI_USER_EMAIL", user.email);
    localStorage.setItem("MEDI_USER_ROLE", user.role);

    location.href = "home.html";
}

/* ======================================================
   CADASTRO (PACIENTE)
====================================================== */
function registerPatient(){
    const name  = document.getElementById("reg_name").value.trim();
    const email = document.getElementById("reg_email").value.trim();
    const pass  = document.getElementById("reg_pass").value.trim();
    const birth = document.getElementById("reg_birth").value.trim();
    const phone = document.getElementById("reg_phone").value.trim();

    if(!name || !email || !pass || !birth || !phone){
        alert("Preencha todos os campos.");
        return;
    }

    if(!email.includes("@")){
        alert("Email inválido.");
        return;
    }

    if(localStorage.getItem("MEDI_USER_"+email)){
        alert("Este email já está cadastrado.");
        return;
    }

    const newUser = {
        name,
        email,
        pass,
        nascimento: birth,
        contato: phone,
        role:"Paciente"
    };

    localStorage.setItem("MEDI_USER_"+email, JSON.stringify(newUser));

    alert("Cadastro realizado com sucesso!");
    showLogin();
}

/* ======================================================
   ALTERNAR TELAS
====================================================== */
function showRegister(){
    document.getElementById("login_area").classList.add("hidden");
    document.getElementById("register_area").classList.remove("hidden");
}

function showLogin(){
    document.getElementById("register_area").classList.add("hidden");
    document.getElementById("login_area").classList.remove("hidden");
}
</script>

</body>
</html>
